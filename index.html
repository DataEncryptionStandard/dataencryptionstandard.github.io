<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>おとあそび</title><style>*{box-sizing:border-box}body{margin:0;background:#fff4dc;font:16px system-ui;display:flex;flex-direction:column;height:100dvh;overscroll-behavior:none}header{display:flex;flex-wrap:wrap;gap:6px;padding:10px;align-items:center}button{border:0;border-radius:15px;background:white;padding:12px;font:inherit;cursor:pointer}button[aria-pressed=true]{outline:3px solid #9167bd}#play{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:8px;padding:10px;touch-action:none;user-select:none}.tile{font-size:clamp(28px,11vw,90px);padding:0;min-height:0}#start{position:fixed;inset:0;background:#fff4dc;display:grid;place-content:center;text-align:center}#go{font-size:28px}#status{font-size:12px;padding:0 10px}input{width:75px}</style><header><button data-mode="random">🌈 ランダム</button><button data-mode="piano">🎹 音階</button><button data-mode="fun">🫧 効果音</button><button data-mode="music">🥁 楽器</button><label>音量 <input id="vol" type="range" min="0" max="0.25" step="0.01" value="0.08"></label></header><main id="play"></main><div id="status" role="status"></div><div id="start"><h1>おとあそび</h1><button id="go">▶ はじめる</button></div><script>
const sets={random:['🌈','⭐','🎈','🫧','🌸','🚀','🍓','🐳','☀️'],piano:['🔴','🟠','🟡','🟢','🔵','🟣','🩷','⭐','🌙'],fun:['🎈','✨','🫧','🚗','🚀','🔔','🥁','💧','🌈'],music:['🥁','🪘','🔔','🎹','🎸','🪇','🎺','🪈','🎵']}, colors=['#ffc0cb','#ffd39b','#fff09b','#b9edb5','#b8e1ff','#d8c4ff','#ffcfeb','#c1f0e8','#ffd9a9'];
const play=document.querySelector('#play'),vol=document.querySelector('#vol'),status=document.querySelector('#status');let mode='random',ctx,bus,last=-Infinity;const touches=new Map();
function render(){play.replaceChildren(...sets[mode].map((s,i)=>{const b=document.createElement('button');b.className='tile';b.dataset.i=i;b.style.background=colors[i];b.textContent=s;return b}));document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===mode));status.textContent='';}
function tone(f,end=f,d=.35,type='sine',amp=.6){const t=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(end,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(amp,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(bus);o.start(t);o.stop(t+d+.02)}
const notes=[262,294,330,349,392,440,494,523,587];
const instruments=[[140,45,.23,'sine'],[210,65,.19,'triangle'],[950,945,.65,'sine'],[523,523,.5,'triangle'],[330,330,.4,'triangle'],[1800,700,.13,'triangle'],[392,392,.4,'sawtooth'],[660,660,.5,'sine'],[880,880,.4,'triangle']];
async function sound(i){if(!ctx||performance.now()-last<110)return;last=performance.now();const tile=play.children[i];tile?.animate?.([{transform:'scale(.85)'},{transform:'scale(1.04)'},{transform:'scale(1)'}],{duration:240});try{if(ctx.state!=='running')await ctx.resume();if(ctx.state!=='running')throw Error('audio');let m=mode;if(m==='random'){m=['piano','fun','music'][Math.floor(Math.random()*3)];i=Math.floor(Math.random()*9);if(tile)tile.textContent=['🌈','⭐','🎈','🫧','🌸','🚀','🍓','🐳','☀️'][Math.floor(Math.random()*9)]}if(m==='piano'){const f=notes[i];tone(f,f,.5,'triangle',.4);tone(f*2,f*2,.15,'sine',.09)}else if(m==='fun'){tone(220+i*80,i%2?150:950,.32,'sine',.4)}else{tone(...instruments[i],.3)}status.textContent=''}catch(e){status.textContent='音が鳴らない場合は、もう一度タップしてください'}}
document.querySelector('#go').onclick=async()=>{try{ctx=new(window.AudioContext||window.webkitAudioContext)();bus=ctx.createGain();bus.gain.value=+vol.value;const limiter=ctx.createDynamicsCompressor();bus.connect(limiter).connect(ctx.destination);await ctx.resume();tone(440);document.querySelector('#start').remove()}catch(e){document.querySelector('#go').textContent='もう一度はじめる'}};vol.oninput=()=>{if(bus)bus.gain.setTargetAtTime(+vol.value,ctx.currentTime,.03)};document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;render()});function hit(e){const d=document.elementFromPoint(e.clientX,e.clientY)?.closest('.tile');if(d&&touches.get(e.pointerId)!==d.dataset.i){touches.set(e.pointerId,d.dataset.i);sound(+d.dataset.i)}}play.onpointerdown=e=>{e.preventDefault();touches.set(e.pointerId,'');hit(e)};play.onpointermove=e=>{if(touches.has(e.pointerId))hit(e)};for(const event of ['pointerup','pointercancel'])window.addEventListener(event,e=>touches.delete(e.pointerId));play.oncontextmenu=e=>e.preventDefault();play.addEventListener('click',e=>{if(e.detail===0&&e.target.closest('.tile'))sound(+e.target.dataset.i)});document.addEventListener('visibilitychange',()=>{if(document.hidden){touches.clear();ctx?.suspend().catch(()=>{})}});render();</script></html>
