<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><title>おとあそび</title><style>*{box-sizing:border-box}body{margin:0;background:#fff4dc;font-family:system-ui,sans-serif;overscroll-behavior:none}header{padding:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}button{border:0;border-radius:16px;padding:12px;background:white;font-size:18px}#play{height:calc(100dvh - 110px);min-height:260px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:10px;touch-action:none;user-select:none} .tile{display:grid;place-items:center;border-radius:24px;font-size:clamp(35px,12vw,90px);transition:transform .12s}.tile:active{transform:scale(.9)}#start{position:fixed;inset:0;background:#fff4dc;display:grid;place-content:center;text-align:center;z-index:2}#start button{font-size:30px;padding:25px}input{width:85px}</style><header><button data-mode="animals">🐶</button><button data-mode="piano">🎹</button><button data-mode="fun">🌈</button><button data-mode="voice">👋</button><label>音量 <input id="vol" type="range" min="0" max="0.25" step="0.01" value="0.08"></label></header><main id="play"></main><div id="start"><h1>おとあそび</h1><button id="go">▶ はじめる</button></div><script>let ctx,mode='animals',last=0;const play=document.querySelector('#play'),vol=document.querySelector('#vol');const sets={animals:['🐶','🐱','🐮','🐸','🐤','🐷','🐑','🦁','🐴'],piano:['🔴','🟠','🟡','🟢','🔵','🟣','🩷','⭐','🌙'],fun:['🎈','✨','🫧','🚗','🚀','🔔','🥁','💧','🌈'],voice:['👋','😊','👏','❤️','☀️','🌙','🎉','🙌','🤗']};const colors=['#ffc0cb','#ffd39b','#fff09b','#b9edb5','#b8e1ff','#d8c4ff','#ffcfeb','#c1f0e8','#ffd9a9'];function render(){play.replaceChildren(...sets[mode].map((s,i)=>{let d=document.createElement('div');d.className='tile';d.dataset.i=i;d.style.background=colors[i];d.textContent=s;return d}))}render();function tone(f,end=f,d=.24,type='sine'){if(!ctx)return;let t=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(end,t+d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(+vol.value,t+.025);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+d+.01)}function speak(s){if(!('speechSynthesis'in window)||+vol.value===0)return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='ja-JP';u.volume=+vol.value;u.pitch=1.3;speechSynthesis.speak(u)}function sound(i){if(Date.now()-last<150)return;last=Date.now();if(mode==='animals')speak(['わんわん','にゃーにゃー','もーもー','けろけろ','ぴよぴよ','ぶーぶー','めーめー','がおー','ひひーん'][i]);else if(mode==='voice')speak(['こんにちは','にこにこ','ぱちぱち','だいすき','おはよう','おやすみ','やったー','ばんざい','ぎゅー'][i]);else if(mode==='piano')tone([262,294,330,349,392,440,494,523,587][i]);else tone(220+i*75,i%2?180:800,.32,'sine');let el=play.children[i];el.animate([{transform:'scale(.88)'},{transform:'scale(1)'}],{duration:260})}document.querySelector('#go').onclick=async()=>{ctx=new (window.AudioContext||window.webkitAudioContext)();await ctx.resume();tone(440);document.querySelector('#start').remove()};document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;render()});play.addEventListener('pointerdown',e=>{let d=e.target.closest('.tile');if(d)sound(+d.dataset.i)});play.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'&&!e.buttons)return;let d=document.elementFromPoint(e.clientX,e.clientY)?.closest('.tile');if(d&&d.dataset.i!==play.dataset.last){play.dataset.last=d.dataset.i;sound(+d.dataset.i)}});play.oncontextmenu=e=>e.preventDefault();</script></html>
